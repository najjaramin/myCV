  build-images:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-api] # Ne build que si les tests passent
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build Image API
        run: |
          docker build -t devsecops-api:test ./api
          echo "✅ Image API construite avec succès"

      - name: Build Image Frontend
        run: |
          docker build -t devsecops-portfolio:test ./my-cv-next
          echo "✅ Image Frontend construite avec succès"
