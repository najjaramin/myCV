name: CI - Tests et Sécurité

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'my-cv-next/package-lock.json'

      - name: Installation des dépendances (Frontend)
        run: cd my-cv-next && npm ci

      - name: Exécution des tests (Frontend)
        run: cd my-cv-next && npm test

  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'api/package-lock.json'

      - name: Installation des dépendances (API)
        run: cd api && npm ci

      - name: Exécution des tests (API)
        run: cd api && npm test

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Gitleaks (Scan des secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installation de Semgrep
        run: pip install semgrep

      - name: Semgrep (SAST)
        run: |
          semgrep scan --config p/javascript --config p/nodejs --config p/owasp-top-ten \
            --exclude node_modules --exclude .next --exclude reports \
            --severity ERROR --error --metrics=off \
            --json-output=semgrep-report.json api my-cv-next

    build-images:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-api]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build Image API
        run: |
          docker build -t devsecops-api:test ./api
          echo "✅ Image API construite"

      - name: Build Image Frontend
        run: |
          docker build -t devsecops-portfolio:test ./my-cv-next
          echo "✅ Image Frontend construite"

      - name: Run Trivy (Scan de l'API)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-api:test'
          format: 'table'
          exit-code: '1' # Fait échouer le workflow si faille trouvée
          ignore-unfixed: true # Ignore les failles sans correctif (comme zlib1g)
          severity: 'CRITICAL'
          vuln-type: 'os,library'

      - name: Run Trivy (Scan du Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-portfolio:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          vuln-type: 'os,library'
